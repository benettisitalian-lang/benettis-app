<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-alt:#F6F4EE;
  --border:rgba(23,20,18,0.1);
  --gold:#D4AF37;
  --gold-text:#A9790F;
  --gold-soft:#C98A4B;
  --ink:#171412;
  --ink-80:rgba(23,20,18,0.78);
  --ink-60:rgba(23,20,18,0.58);
  --ink-40:rgba(23,20,18,0.4);
  --ink-15:rgba(23,20,18,0.1);
  --done:#6E7F45;
  --done-dim:rgba(110,127,69,0.1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--ink);
  min-height:100vh;
}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* HEADER */
header{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:16px 20px 14px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}
header img.logo{
  height:42px;
  width:auto;
  flex-shrink:0;
  border-radius:10px;
}
header .logo-lockup{
  display:flex;
  align-items:center;
  gap:2px;
  flex-shrink:0;
}
header .logo-text{
  height:30px;
  width:auto;
}
header .logo-sun{
  height:46px;
  width:auto;
  animation:sun-spin 12s linear infinite;
  transform-origin:50% 50%;
}
@keyframes sun-spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
header .head-text{flex:1; min-width:0;}
header .sub{
  color:var(--gold-text);
  font-size:10.5px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-weight:600;
}
header .sub span.label{opacity:0.85;}
header .sync-btn{
  background:none;
  border:1px solid rgba(169,121,15,0.4);
  color:var(--gold-text);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:0.15em;
  text-transform:uppercase;
  padding:6px 12px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
}
header .sync-btn:active{background:rgba(212,175,55,0.12);}

/* MAIN CONTENT */
main{
  flex:1;
  padding:18px 16px 110px;
}

.section-title{
  font-family:'Playfair Display',serif;
  font-weight:800;
  font-size:24px;
  letter-spacing:0.2px;
  color:var(--ink);
  margin:24px 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.section-title:first-child{margin-top:0;}

.empty-note{
  font-size:12.5px;
  color:var(--ink-40);
  padding:14px 2px;
  line-height:1.5;
}

/* FILTER CHIPS */
.chip-row{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:4px;
  -webkit-overflow-scrolling:touch;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  background:var(--surface-alt);
  border:1px solid var(--border);
  color:var(--ink-80);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.05em;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
}
.chip.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#171412;
}

/* FORM CARD */
.form-card{
  background:var(--surface-alt);
  border:1px solid var(--border);
  border-radius:24px;
  padding:16px;
  margin-bottom:18px;
}
.form-card .form-row{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}
.form-card .form-row:last-child{margin-bottom:0;}
.form-card input,
.form-card select,
.form-card textarea{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 11px;
  background:#FFFFFF;
  color:var(--ink);
  width:100%;
}
.form-card input::placeholder,
.form-card textarea::placeholder{color:var(--ink-40);}
.form-card textarea{resize:vertical;min-height:54px;line-height:1.4;}
.form-card .btn-add{
  background:var(--gold);
  color:#171412;
  border:none;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:11px 16px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
}
.form-card .btn-add:active{opacity:0.85;}
.form-card .toggle-form{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--gold-text);
  background:none;
  border:1px solid rgba(169,121,15,0.4);
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
  margin-bottom:14px;
}

/* ORDER ITEM ROW */
.item-row{
  display:flex;
  align-items:center;
  gap:10px;
  background:#FFFFFF;
  border:1px solid var(--border);
  border-left:3px solid var(--gold-soft);
  border-radius:16px;
  padding:12px 12px;
  margin-bottom:8px;
  box-shadow:0 1px 3px rgba(23,20,18,0.04);
}
.item-row.done{
  border-left-color:var(--done);
  opacity:0.6;
}
.item-row.done .item-name{text-decoration:line-through;}
.item-check{
  width:22px;height:22px;
  border:2px solid var(--gold);
  border-radius:50%;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:13px;
  color:var(--done);
  font-weight:700;
}
.item-row.done .item-check{border-color:var(--done);background:var(--done-dim);}
.item-body{flex:1;min-width:0;}
.item-name{font-size:13.5px;font-weight:600;color:var(--ink);}
.item-meta{font-size:11px;color:var(--ink-40);margin-top:2px;}
.item-qty{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:700;
  font-size:13px;
  color:var(--gold-text);
  background:rgba(212,175,55,0.12);
  padding:4px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.item-del{
  background:none;border:none;color:var(--ink-40);font-size:15px;cursor:pointer;padding:2px 4px;
}
.item-del:active{color:var(--gold-text);}

.category-label{
  font-size:10.5px;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--gold-text);
  font-weight:700;
  margin:18px 0 8px;
}
.category-label:first-of-type{margin-top:2px;}

/* RECIPE CARD */
.recipe-card{
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:24px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(23,20,18,0.04);
  transition:transform .3s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow .3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.recipe-card.open{
  transform:translateY(-3px);
  box-shadow:0 16px 32px rgba(23,20,18,0.12);
}
.recipe-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  cursor:pointer;
  gap:10px;
}
.recipe-head .rname{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.2px;
  line-height:1.2;
  color:var(--ink);
}
.recipe-head .rcount{font-size:11px;color:var(--ink-40);margin-top:4px;letter-spacing:0.02em;}
.recipe-arrow{font-size:16px;color:var(--gold-text);transition:transform .15s;flex-shrink:0;}
.recipe-card.open .recipe-arrow{transform:rotate(90deg);}
.recipe-body{
  display:none;
  padding:0 18px 18px;
  border-top:1px solid var(--border);
}
.recipe-card.open .recipe-body{display:block;padding-top:14px;}
.recipe-body h4{
  font-size:10.5px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--gold-text);
  font-weight:700;
  margin:0 0 8px;
}
.recipe-body ul, .recipe-body ol{margin:0 0 16px;padding-left:18px;}
.recipe-body li{font-size:13px;line-height:1.65;color:var(--ink-80);}
.recipe-body ol li{padding-left:2px;}
.recipe-del-row{text-align:right;}
.recipe-del-row button{
  background:none;border:1px solid var(--border);color:var(--ink-40);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;
  padding:7px 14px;border-radius:999px;cursor:pointer;
}

/* PREP ITEM */
.prep-course-title{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.2px;
  color:var(--ink);
  margin:22px 0 6px;
}
.prep-course-title:first-of-type{margin-top:2px;}
.prep-station-label{
  font-size:10.5px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--gold-text);
  font-weight:700;
  margin:14px 0 8px;
}
.prep-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px 12px;
  margin-bottom:8px;
  box-shadow:0 1px 3px rgba(23,20,18,0.04);
}
.prep-row.done{opacity:0.55;}
.prep-row.done .prep-task{text-decoration:line-through;}
.prep-check{
  width:20px;height:20px;margin-top:1px;
  border:2px solid var(--gold);
  border-radius:6px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:12px;
  color:var(--done);
  font-weight:700;
}
.prep-row.done .prep-check{border-color:var(--done);background:var(--done-dim);}
.prep-body{flex:1;}
.prep-task{font-size:13.5px;font-weight:600;color:var(--ink);}
.prep-assignee{
  display:inline-block;
  font-size:10.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--gold-soft);
  background:rgba(201,138,75,0.14);
  padding:3px 9px;
  border-radius:999px;
  margin-top:6px;
}

/* BOTTOM NAV — floating glass pill */
nav.tabbar{
  position:fixed;
  bottom:18px;
  left:16px;right:16px;
  max-width:528px;
  margin:0 auto;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:flex;
  z-index:30;
  border:1px solid var(--border);
  border-radius:999px;
  box-shadow:0 16px 36px rgba(23,20,18,0.14);
  padding:6px;
}
nav.tabbar button{
  flex:1;
  background:none;
  border:none;
  color:var(--ink-40);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:10px 4px;
  border-radius:999px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  transition:background .2s, color .2s;
}
nav.tabbar button.active{color:#171412;background:var(--gold);}
nav.tabbar button svg{width:18px;height:18px;}

.loading-note{
  text-align:center;
  color:var(--ink-40);
  font-size:12px;
  padding:30px 0;
}

.app-footer{
  text-align:center;
  color:var(--ink-40);
  font-size:10.5px;
  letter-spacing:0.05em;
  padding:28px 0 8px;
}

.tab-panel{display:none;}
.tab-panel.active{display:block;}
</style>

const SEED_RECIPES = [{"id": "r1", "name": "5 CHEESES X ZUCCHINI FLOWER", "course": "Components", "meta": "Yield 3 PIPING BAGS \u00b7 Prep 10 MIN \u00b7 Storage 7 DAYS", "ingredients": ["RICOTTA CHEESE \u2013 2 KG", "GRATED GRANA PADANO \u2013 300 GR", "GRATED PECORINO \u2013 200 GR", "GORGONZOLA \u2013 350 GR", "MASCARPONE \u2013 250 GR", "EVO OIL \u2013 50 GR", "SALT \u2013 15 GR", "PEPPER \u2013 1 PINCH"], "steps": ["TAKE THE BOWL AND PUT ALL THE INGREDIENTS EXCEPT THE GORGONZOLA. THE GORGONZOLA, PLACE IT IN A SMALLER BOWL AND WARM IT GENTLY IN A BAIN-MARIE SO THAT IT MELTS A LITTLE WITHOUT OVERHEATING IT. THEN ADD IT TO ALL THE OTHER INGREDIENTS AND MIX WELL. AFTER THAT, PREPARE 3 SMALL PIPING BAGS."]}, {"id": "r2", "name": "RICOTTA FILLING X RAVIOLI", "course": "Components", "meta": "Yield 3 PIPING BAGS \u00b7 Prep 10 MIN \u00b7 Storage 7 DAYS", "ingredients": ["RICOTTA CHEESE \u2013 2 KG", "TRUFFLE PASTE \u2013 150 GR", "GRATED GRANA PADANO \u2013 320 GR", "GRATED PERCORINO \u2013 220 GR", "SALT \u2013 20 GR", "PEPPER \u2013 1 PINCH"], "steps": ["PUT EVERYTHING IN A BOWL AND MIX IT WELL UNTIL EVERYTHING'S SMOOTH. MAKE 3 SMALL PIPING BAGS."]}, {"id": "r3", "name": "FRESH PASTA X RAVIOLI", "course": "Components", "meta": "Yield 27 PORTIONS RAVIOLI \u00b7 Prep 10 MIN \u00b7 Storage 7 DAYS", "ingredients": ["00 PASTA FLOUR \u2013 1 KG", "SEMOLINA \u2013 1 KG", "EGG YOLK \u2013 20", "WHOLE EGG \u2013 4", "WHITE WINE \u2013 260 GR", "SALT \u2013 30 GR", "EVO OIL \u2013 10 GR"], "steps": ["TAKE THE KITCHENAID WITH THE PADDLE ATTACHMENT AND ADD FLOUR, SEMOLINA, AND SALT. IN A BOWL, MIX EGG YOLKS AND WHOLE EGGS WITH WHITE WINE AND OLIVE OIL. MIX WELL, AND THEN GRADUALLY POUR INTO THE KITCHENAID UNTIL YOU REACH THE DESIRED CONSISTENCY. ONCE FINISHED, TAKE OUT THE DOUGH, PLACE IT ON THE BENCH, KNEAD IT A LITTLE, AND THEN CUT IT INTO PORTIONS TO VACUUM."]}, {"id": "r4", "name": "POTATO GNOCCHI", "course": "Components", "meta": "Yield 34 PORTIONS \u00b7 Prep 30 MIN \u00b7 Cook 10 MIN \u00b7 Storage 3 MONTHS IN FREEZER", "ingredients": ["ROYAL BLUE POTATO \u2013 5.5 KG", "EGG YOLK \u2013 7", "00 PASTA FLOUR \u2013 2 KG", "SALT \u2013 30 GR"], "steps": ["COOK THE POTATOES IN THE OVEN ON STEAM FOR ONE HOUR AND TEN MINUTES. CHECK THAT THEY ARE NICE AND SOFT. THEN LET THEM COOL FOR ABOUT HALF AN HOUR, PEEL THEM, AND MASH THEM WITH A POTATO MASHER. IN A LARGE BOWL, ADD POTATO, SALT, EGG, MIX A BIT WITH YOUR HANDS, THEN ADD FLOUR AND MIX WELL UNTIL IT BECOMES HOMOGENEOUS. DO NOT MIX TOO LONG. THEN MAKE THE GNOCCHI, PLACE THEM ON A TRAY. EACH PIECE SHOULD BE ABOUT 2.5 BY 2.5 CM. ONCE THEY ARE CHILLED, SO FROZEN, PORTION THE GNOCCHI AT 180 GRAMS EACH."]}, {"id": "r5", "name": "CALAMARI FLOUR", "course": "Components", "meta": "Yield 20 PORTION \u00b7 Prep 5 MIN \u00b7 Storage 1 YEAR", "ingredients": ["CORN FLOUR \u2013 1 KG", "RICE FLOUR \u2013 1 KG", "POLENTA \u2013 1 KG", "GARLIC POWDER \u2013 10 GR", "SALT \u2013 15 GR", "PEPPER \u2013 2 PINCH"], "steps": ["MIX ALL TOGETHER IN A BOWL AND THEN TRANSFER IN A CONTAINER READY FOR THE SERVICE. HAVE ALWAYS A BACKUP ON THE BACK."]}, {"id": "r6", "name": "SMOKED MOZZARELLA X MEATBALLS", "course": "Components", "meta": "Yield 20 PORTIONS \u00b7 Prep 15 MIN \u00b7 Storage 6 DAYS", "ingredients": ["SMOKED FIORDILATTE \u2013 500 GR", "MILK \u2013 360 GR", "CREAM \u2013 160 GR", "BUTTER \u2013 20 GR", "CORN FLOUR \u2013 16 GR", "GRATED GRANA PADANO \u2013 40 GR", "SALT \u2013 1 PINCH", "PEPPER \u2013 1 PINCH", "XANTHAN \u2013 3 GR"], "steps": ["TAKE THE THERMOMIX AND PUT ALL THE INGREDIENTS INSIDE. SET IT TO 90 DEGREES, SELECT 10 MINUTES AT SPEED 3. ONCE THE 10 MINUTES ARE DONE, STRAIN IT WITH A SIEVE. THEN PUT IT BACK INTO THE THERMOMIX, ADD HALF A TEASPOON OF XANTHAN GUM, AND BLEND AGAIN AT SPEED 9 FOR 30 SECONDS UNTIL IT THICKENS. IF IT IS STILL TOO LIQUID, ADD A BIT MORE XANTHAN. STRAIN IT AGAIN, AND IT IS READY."]}, {"id": "r7", "name": "FRESH PASTA X PASTA MACHINE", "course": "Components", "meta": "Yield 55-60 PORTIONS \u00b7 Prep 1 HOUR \u00b7 Storage 7 DAYS", "ingredients": ["SEMOLINA \u2013 6 KG", "WATER \u2013 1800 G", "SALT \u2013 50 G"], "steps": ["PUT THE EXTRUSION DIE YOU NEED ON THE PASTA MACHINE, ADD THE SEMOLINA, THEN GRADUALLY ADD WATER, MIX FOR ABOUT 10 MINUTES, AND THEN EXTRUDE THE PASTA."]}, {"id": "r8", "name": "MEATBALL", "course": "Components", "meta": "Yield 60 PORTIONS \u00b7 Prep 1 HOUR \u00b7 Cook 7 MIN 200\u00ba \u00b7 Storage 7 DAYS", "ingredients": ["PORK MINCE \u2013 5 KG", "BEEF MINCE \u2013 5 KG", "PANKO YELLOW \u2013 800 GR", "EGG YOLK \u2013 5", "SOFTEN BREAD \u2013 600 GR", "PARSLEY \u2013 20 GR", "THYME CHOPPED \u2013 5 GR", "ROSEMARY CHOPPED \u2013 5 GR", "GARLIC MINCE \u2013 2 TBSP", "SALT \u2013 120 GR", "PEPPER \u2013 5 GR", "OREGANO \u2013 5 GR", "EVO OIL \u2013 15 GR"], "steps": ["PUT ALL THE INGREDIENTS INSIDE THE PIZZA DOUGH MACHINE AND RUN IT FOR AT LEAST 15 TO 20 MINUTES, STOPPING AND MIXING IT FROM TIME TO TIME TO ENSURE ALL THE INGREDIENTS ARE WELL COMBINED. A NOTE: THE SOFTENED BREAD IS SIMPLY ONE OR TWO LOAVES FROM THE PIZZERIA, CRUST REMOVED, KEEPING ONLY THE INSIDE, CUT INTO SMALL CUBES, SOAKED IN MILK, THEN BLENDED THOROUGHLY, AND THEN READY TO BE ADDED INTO THE DOUGH.                      ONCE THE DOUGH IS DONE, PREPARE SIX CANS OF TOMATOES AND BLEND THEM. GET A BIG POT, ADD OLIVE OIL AND SOME FINELY CHOPPED ONIONS. LET THEM SAUT\u00c9 A BIT. ADD THE SIX CANS OF BLENDED TOMATOES AND COOK ON MEDIUM HEAT FOR AROUND 15 TO 20 MINUTES. ADD A FEW BASIL LEAVES TO THE TOMATO SAUCE.", "IN THE MEANTIME, ROLL THE MEATBALLS AT 40 TO 45 GRAMS EACH, PLACE THEM ON FLAT TRAYS WITH BAKING PAPER UNDERNEATH, AND COOK THEM IN THE OVEN FOR 7 MINUTES.", "ONCE THE TOMATO SAUCE IS NEARLY READY, ADD THE MEATBALLS AND LET THEM COOK FOR ANOTHER 30 MINUTES ON LOW HEAT COVERED WITH FOIL.", "ONCE READY, PORTION THEM INTO 4 MEATBALLS PER SERVING WITH THREE QUARTERS OF A MEDIUM LADLE OF TOMATO SAUCE PER PORTION, THEN VACUUM SEAL THEM."]}, {"id": "r9", "name": "FOCACCIA", "course": "Components", "meta": "Yield 2 TRAYS \u00b7 Prep 15 MIN \u00b7 Cook 20 MIN \u00b7 Storage DAILY FRESH", "ingredients": ["PIZZA FLOUR \u2013 2160 GR", "WATER \u2013 1560 GR", "SALT \u2013 90 GR", "SUGAR \u2013 60 GR", "DRY YEAST \u2013 18 GR", "EVO OIL \u2013 48 GR"], "steps": ["MIX FLOUR, SALT, SUGAR AND DRY YEAST IN THE KITCHEN AID THEN ADD WATER. AT THE END ADD THE EVO OIL. SPLIT IN 2 TRAYS WITH 2015 GR EACH TRAY OF DOUGH.                                          PUT THE TRAY IN THE OVEN AT 50 DEGREES, WITH 10% HUMIDITY COVERED WITH CLINGWRAP, FOR ABOUT ONE HOUR OR SO. AFTER THAT, SET THE OVEN TO 195 DEGREES AT 30% HUMIDITY, PUT THE FOCACCIA INSIDE AND COOK IT FOR 10 MINUTES, THEN FLIP IT, PLACING IT ON A RACK, AND COOK FOR ANOTHER 5 TO 6 MINUTES."]}, {"id": "r10", "name": "PANNACOTTA", "course": "Components", "meta": "Yield 6/7 PORTIONS \u00b7 Prep 20 MIN \u00b7 Cook 20 MIN \u00b7 Storage 5 DAYS", "ingredients": ["THICKENED CREAM \u2013 1 L", "SUGAR \u2013 160 G", "GELATINE \u2013 17 GR", "VANILLA PASTE \u2013 3 GR"], "steps": ["WEIGH THE GELATIN AND PLACE IT IMMEDIATELY IN A BOWL OR CONTAINER WITH WATER. TAKE A POT, ADD THICKENED CREAM, SUGAR, AND VANILLA PASTE. HEAT IT ON HIGH, STIRRING OCCASIONALLY, AND TURN IT OFF JUST BEFORE IT BOILS. REMOVE IT FROM THE HEAT, ADD THE GELATIN, SQUEEZING IT WELL AND REMOVING ANY EXCESS WATER. WHISK WELL, THEN STRAIN EVERYTHING THROUGH A SIEVE AND PORTION IT OUT."]}, {"id": "r11", "name": "YUZU DRESSING", "course": "Components", "meta": "Yield 1 BOTTLE \u00b7 Prep PREP TIME \u00b7 Storage 6 DAYS", "ingredients": ["YUZU \u2013 500 GR", "MALDON SALT \u2013 8 GR", "TOUSCAN OIL \u2013 350 GR", "EVO OIL \u2013 150 GR", "XANTHAN \u2013 2 GR"], "steps": ["TAKE THE THERMOMIX, ADD THE YUZU AND MALDON SALT, SET IT TO 30 SECONDS AT SPEED 5. ONCE DONE, OPEN IT, ADD THE XANTHAN, CLOSE IT, SET 1 MINUTE AT SPEED 4, THEN WEIGH THE TWO OILS TOGETHER IN A CONTAINER. SET 4 MINUTES AT SPEED 4, START IT, AND POUR THE OIL SLOWLY OVER THOSE 4 MINUTES. ONCE DONE, SET 1 MINUTE AT SPEED 6, AND THEN IT\u2019S READY. PLACE IT IN A CONTAINER AND LET IT REST AT LEAST 30 MINUTES IN THE FRIDGE BEFORE USING."]}, {"id": "r12", "name": "TRUFFLE MAYO", "course": "Components", "meta": "Yield FINAL QUANTITY 6 PIPING BAGS \u00b7 Prep 10 MIN \u00b7 Storage 10 DAYS", "ingredients": ["KEWPIE MAYO \u2013 3 KG 3 PACKET", "LEMON JUICE \u2013 45 G", "TRUFFLE PASTE \u2013 270 G", "SALT \u2013 3 PINCH"], "steps": ["MIX EVERYTHING WELL IN A BOWL AND MAKE PIPING BAGS."]}, {"id": "r13", "name": "CHARDONNAY DRESSING", "course": "Components", "meta": "Yield 1 BOTTLE \u00b7 Prep PREP TIME \u00b7 Storage 14 DAYS", "ingredients": ["CHARDONNAY VINEGAR \u2013 300 GR", "EVO OIL \u2013 700 GR", "SALT \u2013 1 PINCH"], "steps": ["TAKE THE THERMOMIX, SET IT TO 1 MINUTE AT 37 DEGREES, ADD THE OLIVE OIL AND A PINCH OF SALT, AND START IT. ONCE DONE, SET IT TO 2 MINUTES AT SPEED 4, AND DURING THOSE 2 MINUTES ADD 300 GRAMS OF CHARDONNAY VINEGAR. YOU CAN ALSO DO THIS DIRECTLY IN THE BOTTLE."]}, {"id": "r14", "name": "CUSTARD/CHANTILLY", "course": "Components", "meta": "Yield 3 PIPING BAGS \u00b7 Prep 15 MIN \u00b7 Storage 5 DAYS", "ingredients": ["MILK \u2013 1 L", "EGG YOLK \u2013 250 GR 13/14", "SUGAR \u2013 220 GR", "CORN FLOUR \u2013 110 GR", "VANILLA PASTE \u2013 10 GR", "GRATED LEMON ZEST \u2013 2 WHOLE", "\u2014 CHANTILLY \u2014", "ALL THE CUSTARD \u2013 1500 GR", "THICKENED CREAM \u2013 600 GR", "ICING SUGAR \u2013 30 GR"], "steps": ["ADD THE MILK, EGG YOLKS, SUGAR, CORN FLOUR, VANILLA PASTE AND LEMON ZEST TO THE THERMOMIX.", "COOK FOR 8 MINUTES AT 90\u00b0C ON SPEED 4.", "IMMEDIATELY TRANSFER THE PASTRY CREAM TO A SHALLOW TRAY.", "COVER THE SURFACE DIRECTLY WITH GO BETWEEN TO PREVENT A SKIN FROM FORMING.", "CHILL OVERNIGHT IN THE REFRIGERATOR. THE FOLLOWING DAY PLACE THE CUSTARD INTO THE THERMOMIX BOWL.", "MIX FOR 20\u201330 SECONDS ON SPEED 3.5, JUST UNTIL SMOOTH AND CREAMY.", "DO NOT OVERMIX.", "TRANSFER TO A LARGE MIXING BOWL. WHIP THE THICKENED CREAM WITH ICING SUGAR TO SOFT PEAKS IN THE KITCHEN AID. GENTLY FOLD THE WHIPPED CREAM INTO THE CUSTARD UNTIL FULLY INCORPORATED.", "DO NOT WHISK TO STRONG OR THE MIXTURE WILL LOSE VOLUME.", "TRANSFER TO A PIPING BAG.", "KEEP REFRIGERATED UNTIL REQUIRED."]}, {"id": "r15", "name": "PICKLES", "course": "Components", "meta": "Yield 40 PORTIONS \u00b7 Prep 20 MIN \u00b7 Cook 20 MIN \u00b7 Storage 14 DAYS", "ingredients": ["RED ONIONS \u2013 300 GR", "FENNEL \u2013 500 GR", "BROCCOLI \u2013 500 GR", "CAULIFLOWER \u2013 500 GR", "CARROTS \u2013 500 GR", "CELERY \u2013 200 GR", "ZUCCHINI \u2013 300 GR", "CAPSICUMS \u2013 200 GR", "\u2014 PICKLES LIQUID \u2014", "RED WINE VINEGAR \u2013 1 L", "WHITE WINE VINEGAR \u2013 750 GR", "WHITE WINE \u2013 250 GR", "SUGAR \u2013 160 GR", "SALT \u2013 65 GR", "STAR ANICE \u2013 3", "BAY LEAVES \u2013 5", "BLACK PEPPERCORN \u2013 15"], "steps": ["PLACE THE RED WINE VINEGAR, WHITE WINE VINEGAR, WHITE WINE, SUGAR, SALT, STAR ANISE, BAY LEAVES AND BLACK PEPPERCORNS INTO A LARGE POT.", "BRING TO A BOIL.", "ADD THE CARROTS, CAULIFLOWER, FENNEL, CELERY AND RED ONION TO THE BOILING LIQUID.", "COOK FOR 2 MINUTES.", "ADD THE BROCCOLI AND ZUCCHINI.", "COOK FOR A FURTHER 1 MINUTE.", "REMOVE FROM THE HEAT IMMEDIATELY.", "TRANSFER THE VEGETABLES AND ALL THE PICKLING LIQUID INTO A GASTRONORM CONTAINER.", "COVER WITH A LID OR CLING WRAP WHILE STILL HOT.", "ALLOW TO COOL COMPLETELY.", "REFRIGERATE OVERNIGHT BEFORE USING.", "FOR BEST RESULTS, KEEP ALL VEGETABLES CUT TO A SIMILAR SIZE TO ENSURE EVEN PICKLING AND CONSISTENT TEXTURE."]}, {"id": "r16", "name": "MASHROOM SAUCE FOR STAKE", "course": "Components", "meta": "Yield 28/30 PORTIONS \u00b7 Prep 45 MIN \u00b7 Cook 35 MIN \u00b7 Storage 5 DAYS", "ingredients": ["MIXED MUSHROOMS \u2013 1 KG 1 PACKET", "LEEKS THINLY SLICED \u2013 150 GR", "GARLIC MINCE \u2013 20 GR", "BUTTER \u2013 40 GR", "EVO OIL \u2013 30 GR", "THYME \u2013 8 GR", "DRIED PORCINI \u2013 30 GR", "CHICKEN STOCK \u2013 500 GR", "PORCINI LIQUID \u2013 100 GR", "THICKENED CREAM \u2013 1 L", "DIJON MUSTARD \u2013 10 GR", "SALT \u2013 10 GR", "PEPPER \u2013 1 PINCH"], "steps": ["SOAK THE DRIED PORCINI IN HOT WATER FOR 20 MINUTES. STRAIN AND RESERVE 100 ML OF THE LIQUID. HEAT THE OLIVE OIL AND BUTTER IN A LARGE POT OVER MEDIUM-HIGH HEAT.", "ADD THE MIXED MUSHROOMS AND COOK UNTIL WELL CARAMELISED AND GOLDEN BROWN. ADD THE LEEKS AND COOK FOR 5 MINUTES UNTIL SOFTENED. ADD THE GARLIC AND THYME AND COOK FOR 1 MINUTE. ADD THE PORCINI AND COOK FOR 2 MINUTES. ADD THE CHICKEN STOCK, PORCINI LIQUID AND THE FINE SALT.", "REDUCE BY APPROXIMATELY HALF.", "ADD THE THICKENED CREAM AND DIJON MUSTARD.", "BRING TO A GENTLE SIMMER AND COOK FOR 20\u201325 MINUTES, STIRRING OCCASIONALLY.", "TRANSFER TO A THERMOMIX AND BLEND UNTIL COMPLETELY SMOOTH.", "RETURN TO THE STOVE, ADD BLACK PEPPER TO TASTE, AND REDUCE FOR ANOTHER 10 MIN.", "THE SAUCE SHOULD BE SMOOTH AND THICK ENOUGH TO COAT THE BACK OF A SPOON.", "ONCE IS COLD, VACUUM IT IN BAGS."]}, {"id": "r17", "name": "NDUJA HONEY", "course": "Components", "meta": "Yield 20 PORTIONS \u00b7 Prep 15 MIN \u00b7 Storage 6 DAYS", "ingredients": ["NDUJA \u2013 300 GR", "HONEY \u2013 240 GR", "WATER \u2013 40 GR", "VINEGAR \u2013 20 GR"], "steps": ["TAKE THE THERMOMIX, PUT NDUJA AND HONEY,  SET 5 MINUTES, 80\u00b0C, VELOCITY 1. THEN, WHEN THAT IS DONE, ADD THE WATER AND AGAIN SET 80\u00b0C, VELOCITY 2 FOR ANOTHER 5 MINUTES. THEN, WHEN THAT IS DONE, ADD THE VINEGAR AND SET 30 SECONDS, VELOCITY 3. AFTER THAT, SET 30 SECONDS, SPEED 6, UNTIL SMOOTH."]}, {"id": "r18", "name": "ALMOND/PISTACHIO/HAZELNUT PRALINE", "course": "Components", "meta": "Yield 15 PORTIONS \u00b7 Prep 10 MIN \u00b7 Cook 10 MIN \u00b7 Storage 10 DAYS", "ingredients": ["NUTS \u2013 100 GR", "SUGAR \u2013 100 GR", "WATER \u2013 50 GR"], "steps": ["TOAST THE NUTS BEFORE AND REMOVE THE SKINS. THEN COMBINE SUGAR AND WATER IN A NON-STICK PAN OVER MEDIUM HEAT. LET IT DISSOLVE AND BUBBLE. ADD THE NUTS. STIR UNTIL THE SUGAR CRYSTALLIZES AND COATS THE NUTS WITH A GLAZE. SPREAD THEM ON PARCHMENT PAPER AND LET THEM COOL. THEN BLEND THEM WITH THE ROBOT COOUPE TO CREATE A COARSE PRALINE CRUNCH."]}, {"id": "r19", "name": "TIRAMISU'", "course": "Components", "meta": "Yield 1 TRAY \u00b7 Prep 30 MIN \u00b7 Storage 4 DAYS", "ingredients": ["MASCARPONE CHEESE \u2013 1.25 KG", "EGG YOLK \u2013 240 GR ABOUT 12", "WHITE EGG \u2013 300 GR", "SUGAR YOLK/WHITE \u2013 140 GR 100 GR", "COFFEE \u2013 300 ML", "SAVOIARDI \u2013 50/52 PCS", "\u2014 PASTEURIZED EGGS \u2014", "\u2014 SOUS-VIDE \u2014", "\u2014 55\u00ba X 45 MINUTES \u2014"], "steps": ["FIRST OF ALL, YOU NEED TO PASTEURIZE THE EGGS. PASTEURIZE THEM A FEW DAYS BEFORE, SO THAT YOU HAVE THEM READY IN INDIVIDUAL VACUUM BAGS. ONCE THAT IS DONE, TAKE THE KITCHENAID, ADD THE EGGS AND SUGAR, AND MIX WELL UNTIL IT IS NICE, DENSE AND SMOOTH. THEN ADD THE MASCARPONE AND WHIP AGAIN UNTIL IT IS NICE AND SOLID. TRANSFER EVERYTHING TO A LARGE BOWL. THEN, SEPARATELY, CLEAN THE KITCHENAID BOWL AND WHIP THE EGG WHITES, ADDING THE REMAINING SUGAR. ONCE THAT IS DONE, TAKE A TRAY, SPREAD A SMALL AMOUNT OF CREAM ON THE BOTTOM, JUST A LITTLE TO MAKE THE BISCUITS STICK.PLACE THE BISCUITS, THEN A GENEROUS LAYER OF CREAM IN BETWEEN, ANOTHER LAYER OF BISCUITS, AND FINALLY A THICK TOP LAYER OF CREAM TO FINISH THE WHOLE DESSERT. REMEMBER, THE BISCUITS SHOULD SOAK IN THE COFFEE FOR JUST ONE SECOND MAXIMUM BEFORE BEING ASSEMBLED."]}, {"id": "r20", "name": "BATTER", "course": "Components", "meta": "Yield 25 PCS \u00b7 Prep 10 MIN \u00b7 Storage 3 DAYS", "ingredients": ["SPARKLING WATER \u2013 1.2 L", "SELF RISINF FLOUR \u2013 1 KG", "SALT \u2013 2 PINCH", "PEPPER \u2013 1 PINCH"], "steps": ["TAKE THE THERMOMIX, ADD THE FLOUR, THEN ADD THE WATER, SALT, AND PEPPER. AFTER THAT, CLOSE IT, SET IT FOR 30 SECONDS AT SPEED 3 TO INCORPORATE EVERYTHING WELL. ONCE DONE, MIX THOROUGHLY WITH A SPATULA TO ENSURE ALL THE FLOUR IS COMBINED. THEN, RUN IT FOR 1 MINUTE AT SPEED 10. ONCE IT\u2019S READY, CHECK CAREFULLY THAT THERE ARE NO LUMPS. IF THERE ARE, KEEP GOING FOR ANOTHER MINUTE."]}, {"id": "r21", "name": "BLACK GARLIC AIOLI", "course": "Components", "meta": "Yield 20/25 PORTIONS \u00b7 Prep 10 MIN \u00b7 Storage 5 DAYS", "ingredients": ["BLACK GARLIC HEADS \u2013 6", "KEWPI MAYO \u2013 1 KG", "RED VINEGAR \u2013 10 GR"], "steps": ["PLACE THE BLACK GARLIC HEADS IN THE THERMOMIX AND BLEND THEM. THEN ADD THE MAYO AND THE RED VINEGAR. BLEND UNTIL SMOOTH. ONCE DONE, SCRAPE DOWN THE SIDES WITH A SPATULA, CHECK THAT IT IS WELL INCORPORATED. ONCE IS DONE PUT IT IN PIPING BAGS."]}, {"id": "r22", "name": "WHIPPED RICOTTA X SALUMI BOARD", "course": "Components", "meta": "Yield 40 PORTIONS \u00b7 Prep 15 MIN \u00b7 Storage 4 DAYS", "ingredients": ["RICOTTA CHEESE \u2013 2 KG", "THICKENED CREAM \u2013 300 G", "HONEY \u2013 40 GR", "GRATED LEMON ZEST \u2013 2 WHOLE", "MALDON SALT \u2013 12 GR"], "steps": ["PLACE THE RICOTTA, THICKENED CREAM, HONEY, LEMON ZEST, AND MALDON SALT INTO THE KITCHENAID BOWL FITTED WITH THE WHISK ATTACHMENT.", "START ON LOW SPEED AND GRADUALLY INCREASE TO MEDIUM SPEED.", "WHIP FOR 2 TO 3 MINUTES UNTIL THE MIXTURE IS SMOOTH AND CREAMY.", "SCRAPE DOWN THE SIDES OF THE BOWL IF REQUIRED AND MIX FOR AN ADDITIONAL 30 SECONDS.", "MAKE PIPING BAGS."]}, {"id": "r23", "name": "ACQUA PAZZA SAUCE", "course": "Components", "meta": "Yield 15 PORTIONS \u00b7 Prep 15 MIN \u00b7 Cook 30 MIN \u00b7 Storage 3 DAYS", "ingredients": ["EVO OIL \u2013 30 GR", "GARLIC MINCE \u2013 40 GR", "WHITE WINE \u2013 500 GR", "WATER OR FISH STOCK \u2013 2.5 L", "CAPERS \u2013 120 GR", "PITTED OLIVES \u2013 150 GR", "BAY LEAVES \u2013 2", "PARSLEY STICKS AND LEAVES \u2013 2", "BASIL STICKS AND LEAVES \u2013 2", "SALT \u2013 30 GR", "PEPPER \u2013 5 GR", "CHERRY TOMATO \u2013 1.5 KG"], "steps": ["HEAT THE OLIVE OIL IN A LARGE POT.", "ADD THE GARLIC MINCE AND COOK GENTLY FOR 30 SECONDS WITHOUT COLOURING.", "ADD THE WHITE WINE AND REDUCE BY ABOUT ONE THIRD.", "ADD THE WATER, CAPERS, OLIVES, BAY LEAVES, PARSLEY AND BASIL, SALT AND BLACK PEPPER.", "BRING TO A GENTLE SIMMER AND COOK FOR 20 MINUTES. AFTER THAT ADD THE CHERRY TOMATOES AND COOK FOR A FURTHER 3-5 MINUTES ONLY.", "REMOVE FROM THE HEAT.", "REMOVE THE BAY LEAVES, PARSLEY AND BASIL STICKS.", "COOL DOWN RAPIDLY IN COOLROOM."]}, {"id": "r24", "name": "ANCHOVY DRESSING", "course": "Components", "meta": "Yield 500 GR \u00b7 Prep 10 MIN \u00b7 Storage 5 DAYS", "ingredients": ["ANCHOVIY FILLETS \u2013 75 GR", "DIJON MUSTARD \u2013 40 GR", "LEMON JUICE \u2013 60 GR", "CHARDONNAY VINEGAR \u2013 40 GR", "WATER \u2013 60 GR", "EVO OIL \u2013 225 GR", "PEPPER \u2013 HALF PINCH", "XANTHAN \u2013 1.5 GR"], "steps": ["TAKE THE THERMOMIX AND ADD ANCHOVIES, DIJON MUSTARD, LEMON JUICE, CHARDONNAY VINEGAR, WATER AND BLACK PEPPER.", "BLEND 1 MINUTE VELOCITY 10.", "SCRAPE DOWN THE SIDES.", "BLEND 30 SECONDS VELOCITY 10 UNTIL COMPLETELY SMOOTH.", "SET 2 MINUTES VELOCITY 4, LET IT START AND THEN SLOWLY POUR THE OLIVE OIL ONTO THE LID SO IT EMULSIFIES INTO THE DRESSING. ONCE ITS DONE ADD THE XANTHAN GUM AND BLEND 30 SECONDS VELOCITY 8.", "ALLOW TO REST FOR 20 MINUTES BEFORE USE."]}];

let state = { orders: [], recipes: [], prep: [], loaded: false };
let openRecipeIds = new Set();
let recipeFilter = "All";
let firebaseOffline = false;
let localEditPending = false; // true while we're applying our own write, to avoid a redundant re-render flash

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)); }

function applyIncomingData(data){
  const newOrders = (data && data.orders) || [];
  const newRecipes = (data && data.recipes && data.recipes.length) ? data.recipes : SEED_RECIPES;
  const newPrep = (data && data.prep && data.prep.length) ? data.prep : SEED_PREP;
  state.orders = newOrders;
  state.recipes = newRecipes;
  state.prep = newPrep;
  state.loaded = true;
  renderAll();
}

function startRealtimeSync(){
  if(!firebaseUsable){
    // No Firebase bridge available at all (e.g. script blocked) — run on local seed data only.
    state.orders = []; state.recipes = SEED_RECIPES; state.prep = SEED_PREP; state.loaded = true;
    setStorageStatus(false, 'no-firebase');
    renderAll();
    return;
  }

  // Live connection indicator
  fbDb.ref('.info/connected').on('value', (snap)=>{
    firebaseOffline = (snap.val() === false);
    setStorageStatus(!firebaseOffline);
  });

  // Real-time listener: fires immediately with current data, then again on every change
  // made by anyone (including from other phones), no polling needed.
  dataRef.on('value', (snapshot)=>{
    const data = snapshot.val();
    if(!data){
      // First time ever — seed the shared database so everyone starts from the same data.
      dataRef.set({ orders: [], recipes: SEED_RECIPES, prep: SEED_PREP }).catch(e=>console.error('seed error', e));
      return; // the .set above will re-trigger this listener with real data
    }
    applyIncomingData(data);
  }, (error)=>{
    console.error('Firebase read error', error);
    state.orders = []; state.recipes = SEED_RECIPES; state.prep = SEED_PREP; state.loaded = true;
    setStorageStatus(false, 'error');
    renderAll();
  });
}

async function saveAll(){
  if(!firebaseUsable){ return; }
  try{
    await dataRef.set({ orders: state.orders, recipes: state.recipes, prep: state.prep });
  }catch(e){
    console.error('save error', e);
    setStorageStatus(false, 'error');
  }
}

function saveOrders(){ saveAll(); }
function saveRecipes(){ saveAll(); }
function savePrep(){ saveAll(); }

function setStorageStatus(ok, reason){
  const banner = document.getElementById('storageBanner');
  const bannerText = document.getElementById('storageBannerText');
  if(!banner) return;
  if(ok){
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'flex';
  if(reason === 'no-firebase'){
    bannerText.textContent = "Can't reach the team database (no connection) — showing default data only.";
  }else{
    bannerText.textContent = "You're offline — changes will sync automatically once you're back online.";
  }
}

function renderOrders(){
  const panel = document.getElementById('ordersPanel');
  if(!state.loaded){ panel.innerHTML = '<div class="loading-note">Loading the order list…</div>'; return; }

  let html = `
  <div class="form-card">
    <div class="form-row">
      <input type="text" id="ordName" placeholder="Item name (e.g. Chicken breast)">
    </div>
    <div class="form-row">
      <select id="ordCat">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
      <input type="number" id="ordQty" placeholder="Qty" min="0" step="0.5" style="max-width:80px;">
      <select id="ordUnit" style="max-width:80px;">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select>
    </div>
    <div class="form-row">
      <button class="btn-add" id="ordAddBtn">+ Add to order</button>
    </div>
  </div>`;

  if(state.orders.length===0){
    html += `<div class="empty-note">No items on the list yet. Add the first item to order above.</div>`;
  }else{
    for(const cat of CATEGORIES){
      const items = state.orders.filter(i=>i.category===cat);
      if(items.length===0) continue;
      html += `<div class="category-label">${cat}</div>`;
      for(const it of items){
        html += `
        <div class="item-row ${it.ordered?'done':''}" data-id="${it.id}">
          <div class="item-check" data-action="toggle-order">${it.ordered?'✓':''}</div>
          <div class="item-body">
            <div class="item-name">${escapeHtml(it.name)}</div>
            <div class="item-meta">${it.ordered?'Ordered':'To order'}</div>
          </div>
          <div class="item-qty">${it.qty} ${it.unit}</div>
          <button class="item-del" data-action="del-order">✕</button>
        </div>`;
      }
    }
  }
  panel.innerHTML = html;

  document.getElementById('ordAddBtn').onclick = ()=>{
    const name = document.getElementById('ordName').value.trim();
    const qty = document.getElementById('ordQty').value || '1';
    const unit = document.getElementById('ordUnit').value;
    const category = document.getElementById('ordCat').value;
    if(!name) return;
    state.orders.push({id:uid(), name, qty, unit, category, ordered:false});
    saveOrders();
    renderOrders();
  };

  panel.querySelectorAll('[data-action="toggle-order"]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.closest('.item-row').dataset.id;
      const it = state.orders.find(x=>x.id===id);
      it.ordered = !it.ordered;
      saveOrders();
      renderOrders();
    };
  });
  panel.querySelectorAll('[data-action="del-order"]').forEach(el=>{
    el.onclick = ()=>{
      const row = el.closest('.item-row');
      const id = row.dataset.id;
      const it = state.orders.find(x=>x.id===id);
      if(!confirm(`Remove "${it ? it.name : 'this item'}" from the order list?`)) return;
      state.orders = state.orders.filter(x=>x.id!==id);
      saveOrders();
      renderOrders();
    };
  });
}

  <button class="toggle-form" id="recToggleForm">+ Add new recipe</button>

        <div class="recipe-head" data-action="toggle-recipe">

          <div class="recipe-arrow">›</div>

        </div>
      </div>`;
    }
  }
  panel.innerHTML = html;

  document.getElementById('recToggleForm').onclick = ()=>{
    const f = document.getElementById('recForm');

  };

  document.getElementById('recAddBtn').onclick = ()=>{
    const name = document.getElementById('recName').value.trim();
    const ingredients = document.getElementById('recIngredients').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const steps = document.getElementById('recSteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!name || ingredients.length===0) return;
    state.recipes.push({id:uid(), name, course:'Components', meta:'', ingredients, steps});
    saveRecipes();
    renderRecipes();
  };

  panel.querySelectorAll('[data-action="toggle-recipe"]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.closest('.recipe-card').dataset.id;
      if(openRecipeIds.has(id)) openRecipeIds.delete(id); else openRecipeIds.add(id);
      renderRecipes();
    };
  });
  panel.querySelectorAll('[data-action="del-recipe"]').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const id = el.closest('.recipe-card').dataset.id;
      const r = state.recipes.find(x=>x.id===id);
      if(!confirm(`Delete the recipe "${r ? r.name : 'this recipe'}"? This can't be undone.`)) return;
      state.recipes = state.recipes.filter(x=>x.id!==id);
      saveRecipes();
      renderRecipes();
    };
  });
}

  </div>`;

  if(state.prep.length===0){
    html += `<div class="empty-note">No prep tasks yet. Add the first task above.</div>`;
  }else{
    for(const course of PREP_COURSES){
      const items = state.prep.filter(t=>t.course===course);
      if(items.length===0) continue;
      html += `<div class="prep-course-title">${course}</div>`;
      let lastStation = null;
      for(const t of items){
        if(t.station && t.station !== lastStation){
          html += `<div class="prep-station-label">${escapeHtml(t.station)}</div>`;
          lastStation = t.station;
        } else if(!t.station){
          lastStation = null;
        }
        html += `
        <div class="prep-row ${t.done?'done':''}" data-id="${t.id}">
          <div class="prep-check" data-action="toggle-prep">${t.done?'✓':''}</div>
          <div class="prep-body">
            <div class="prep-task">${escapeHtml(t.task)}</div>
            ${t.assignee?`<div class="prep-assignee">${escapeHtml(t.assignee)}</div>`:''}
          </div>
          <button class="item-del" data-action="del-prep">✕</button>
        </div>`;
      }
    }
    // any tasks with a course not in PREP_COURSES (custom/unmatched)
    const other = state.prep.filter(t=>!PREP_COURSES.includes(t.course));
    if(other.length){
      html += `<div class="prep-course-title">Other</div>`;
      for(const t of other){
        html += `
        <div class="prep-row ${t.done?'done':''}" data-id="${t.id}">
          <div class="prep-check" data-action="toggle-prep">${t.done?'✓':''}</div>
          <div class="prep-body">
            <div class="prep-task">${escapeHtml(t.task)}</div>
            ${t.assignee?`<div class="prep-assignee">${escapeHtml(t.assignee)}</div>`:''}
          </div>
          <button class="item-del" data-action="del-prep">✕</button>
        </div>`;
      }
    }
  }
  panel.innerHTML = html;

  document.getElementById('prepToggleForm').onclick = ()=>{
    const f = document.getElementById('prepForm');
    f.style.display = f.style.display==='none' ? 'block' : 'none';
  };

  document.getElementById('prepAddBtn').onclick = ()=>{
    const task = document.getElementById('prepTask').value.trim();
    const course = document.getElementById('prepCourse').value;
    const station = document.getElementById('prepStation').value.trim();
    const assignee = document.getElementById('prepAssignee').value.trim();
    if(!task) return;
    state.prep.push({id:uid(), course, station, task, assignee, done:false});
    savePrep();
    renderPrep();
  };

  panel.querySelectorAll('[data-action="toggle-prep"]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.closest('.prep-row').dataset.id;
      const t = state.prep.find(x=>x.id===id);
      t.done = !t.done;
      savePrep();
      renderPrep();
    };
  });
  panel.querySelectorAll('[data-action="del-prep"]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.closest('.prep-row').dataset.id;
      const t = state.prep.find(x=>x.id===id);
      if(!confirm(`Remove the task "${t ? t.task : 'this task'}" from the prep list?`)) return;
      state.prep = state.prep.filter(x=>x.id!==id);
      savePrep();
      renderPrep();
    };
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- TABS ---------- */
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab+'Panel').classList.add('active');
  };
});

document.getElementById('syncBtn').onclick = ()=>{
  // With real-time sync there's nothing to manually pull — this just re-checks the connection.
  if(firebaseUsable){ setStorageStatus(!firebaseOffline); }
};
document.getElementById('retryBtn').onclick = ()=>{
  location.reload();
};

/* ---------- INIT ---------- */
startRealtimeSync();
</script>

</body>
</html>
